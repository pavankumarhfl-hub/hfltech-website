name: HFL Tech Site QA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required site files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f assets/style.css
          test -f assets/premium.css
          test -f data/claims.json
          test -f content/site-copy.json
          echo "HFL Tech site structure validated."
