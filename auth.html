<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — HFL Tech</title>
<meta name="description" content="Sign in or create an HFL Tech account.">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>
<main class="auth-shell">
  <section class="auth-visual" aria-hidden="true">
    <div class="visual-grid"></div>
    <div class="visual-orb"></div>
    <div class="visual-copy"><span>HFL TECH</span><h2>Intelligence, with a place to work.</h2><p>Access your HFL Tech workspace and AgentMesh services.</p></div>
  </section>
  <section class="auth-panel">
    <a class="auth-brand" href="index.html"><span>HFL</span><b>HFL Tech</b></a>
    <div class="auth-card">
      <div class="auth-head"><div class="eyebrow" id="eyebrow">WELCOME BACK</div><h1 id="title">Sign in</h1><p id="subtitle">Continue to your HFL Tech account.</p></div>
      <div class="auth-error" id="error" role="alert" hidden></div>
      <form id="auth-form" novalidate>
        <div class="field" id="name-field" hidden><label for="name">Full name</label><input id="name" name="name" autocomplete="name" placeholder="Your name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>
        <div class="field" id="password-field"><div class="field-top"><label for="password">Password</label><a href="?mode=reset">Forgot password?</a></div><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="••••••••"><button type="button" id="toggle" aria-label="Show password">Show</button></div></div>
        <div class="field" id="confirm-field" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="••••••••"></div>
        <label class="consent" id="consent" hidden><input type="checkbox" id="agree"><span>I agree to the HFL Tech terms and privacy policy.</span></label>
        <button class="primary" id="submit" type="submit">Sign in <span>→</span></button>
      </form>
      <div class="divider"><span>or</span></div>
      <button class="secondary" id="google" type="button">Continue with Google</button>
      <p class="switch" id="switch">New to HFL Tech? <a href="?mode=signup">Create an account</a></p>
      <a class="back" href="index.html">← Back to HFL Tech</a>
    </div>
    <footer>© 2026 HFL Tech · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>
  </section>
</main>
<script src="assets/auth.js" defer></script>
</body>
</html>
