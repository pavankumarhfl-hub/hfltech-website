<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">AgentMesh evaluation dashboard</title><desc id="desc">Original dark evaluation interface illustrating deterministic checks, trace steps and human control.</desc><rect width="1200" height="520" rx="16" fill="#0c0d0f"/><rect x="1" y="1" width="1198" height="518" rx="16" fill="none" stroke="#292b30"/><text x="32" y="44" fill="#777980" font-family="Inter,Arial" font-size="10">EVALUATION / REFERENCE RUNTIME</text><text x="32" y="82" fill="#f2f2f4" font-family="Inter,Arial" font-size="25" font-weight="600">Runtime checks</text><text x="32" y="112" fill="#85878e" font-family="Inter,Arial" font-size="12">Deterministic checks across the public AgentMesh browser reference.</text><rect x="32" y="150" width="230" height="310" rx="10" fill="#111214" stroke="#292b30"/><text x="56" y="184" fill="#777980" font-family="Inter,Arial" font-size="10">RESULT</text><text x="56" y="244" fill="#f5f5f6" font-family="Inter,Arial" font-size="68" font-weight="600">6/6</text><text x="56" y="276" fill="#8b8d94" font-family="Inter,Arial" font-size="13">checks passing</text><rect x="56" y="310" width="180" height="8" rx="4" fill="#23252a"/><rect x="56" y="310" width="180" height="8" rx="4" fill="#54d39a"/><text x="56" y="350" fill="#54d39a" font-family="Inter,Arial" font-size="11">VERIFIED REFERENCE RESULT</text><text x="56" y="382" fill="#777980" font-family="Inter,Arial" font-size="10">Protocol</text><text x="56" y="404" fill="#d6d7da" font-family="Inter,Arial" font-size="12">Defined reference suite</text><g transform="translate(294 150)"><rect width="874" height="310" rx="10" fill="#111214" stroke="#292b30"/><text x="24" y="34" fill="#777980" font-family="Inter,Arial" font-size="10">CHECK TRACE</text><g font-family="Inter,Arial" font-size="12"><text x="28" y="78" fill="#54d39a">●</text><text x="48" y="78" fill="#d8d9dc">01 · context resolution</text><text x="48" y="98" fill="#70727a">Input state loaded and normalised.</text><text x="28" y="132" fill="#54d39a">●</text><text x="48" y="132" fill="#d8d9dc">02 · runtime routing</text><text x="48" y="152" fill="#70727a">Execution path selected.</text><text x="28" y="186" fill="#54d39a">●</text><text x="48" y="186" fill="#d8d9dc">03 · tool contract</text><text x="48" y="206" fill="#70727a">Authorised interface validated.</text><text x="28" y="240" fill="#54d39a">●</text><text x="48" y="240" fill="#d8d9dc">04–06 · evaluation</text><text x="48" y="260" fill="#70727a">Result, control and output checks passed.</text></g></g></svg>