<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">AgentMesh workspace</title><desc id="desc">Original dark product interface illustration showing an AgentMesh task, context, execution and evaluation panels.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151618"/><stop offset="1" stop-color="#090a0b"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7c82ff"/><stop offset="1" stop-color="#b8a9ff"/></linearGradient></defs><rect width="1400" height="760" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="758" rx="18" fill="none" stroke="#292b30"/><rect x="0" y="0" width="210" height="760" fill="#101113"/><circle cx="28" cy="30" r="7" fill="#e8e8ea"/><text x="48" y="35" fill="#f1f1f3" font-family="Inter,Arial" font-size="16" font-weight="600">AgentMesh</text><g fill="#85878e" font-family="Inter,Arial" font-size="13"><text x="28" y="90">Overview</text><text x="28" y="128">Tasks</text><text x="28" y="166">Context</text><text x="28" y="204">Tools</text><text x="28" y="242">Evaluation</text><text x="28" y="280">Runs</text></g><rect x="18" y="320" width="174" height="38" rx="7" fill="#1b1d22" stroke="#303239"/><text x="31" y="344" fill="#d9d9dc" font-family="Inter,Arial" font-size="12">Active runtime</text><circle cx="177" cy="339" r="4" fill="#54d39a"/><text x="236" y="52" fill="#777980" font-family="Inter,Arial" font-size="11">RUNTIME / TASK-042</text><text x="236" y="92" fill="#f2f2f4" font-family="Inter,Arial" font-size="26" font-weight="600">Prepare execution plan</text><text x="236" y="121" fill="#8e9097" font-family="Inter,Arial" font-size="13">AgentMesh is reasoning over the supplied context and authorised tools.</text><rect x="236" y="158" width="720" height="180" rx="10" fill="#101113" stroke="#292b30"/><text x="260" y="190" fill="#777980" font-family="Inter,Arial" font-size="10">CONTEXT</text><text x="260" y="222" fill="#d6d7da" font-family="Inter,Arial" font-size="14">Goal</text><text x="330" y="222" fill="#8d8f96" font-family="Inter,Arial" font-size="14">Complete the workflow using approved systems.</text><text x="260" y="258" fill="#d6d7da" font-family="Inter,Arial" font-size="14">Constraints</text><text x="330" y="258" fill="#8d8f96" font-family="Inter,Arial" font-size="14">Human approval required before external action.</text><text x="260" y="294" fill="#d6d7da" font-family="Inter,Arial" font-size="14">State</text><text x="330" y="294" fill="#8d8f96" font-family="Inter,Arial" font-size="14">3 sources loaded · 2 tools available</text><rect x="982" y="158" width="382" height="180" rx="10" fill="#101113" stroke="#292b30"/><text x="1006" y="190" fill="#777980" font-family="Inter,Arial" font-size="10">EXECUTION</text><circle cx="1012" cy="225" r="5" fill="#7c82ff"/><text x="1028" y="230" fill="#d7d8db" font-family="Inter,Arial" font-size="13">Reasoning complete</text><circle cx="1012" cy="260" r="5" fill="#54d39a"/><text x="1028" y="265" fill="#d7d8db" font-family="Inter,Arial" font-size="13">Tool access verified</text><circle cx="1012" cy="295" r="5" fill="#e2b45f"/><text x="1028" y="300" fill="#d7d8db" font-family="Inter,Arial" font-size="13">Waiting for approval</text><rect x="236" y="366" width="1128" height="330" rx="10" fill="#101113" stroke="#292b30"/><text x="260" y="400" fill="#777980" font-family="Inter,Arial" font-size="10">EVALUATION / TRACE</text><g stroke="#272a30" stroke-width="1"><line x1="260" y1="440" x2="1338" y2="440"/><line x1="260" y1="500" x2="1338" y2="500"/><line x1="260" y1="560" x2="1338" y2="560"/><line x1="260" y1="620" x2="1338" y2="620"/></g><polyline points="280,610 390,560 500,580 610,480 720,520 830,460 940,500 1050,430 1160,470 1280,420" fill="none" stroke="url(#accent)" stroke-width="3"/><g fill="#8d8f96" font-family="Inter,Arial" font-size="11"><text x="270" y="655">Context</text><text x="470" y="655">Plan</text><text x="670" y="655">Tool call</text><text x="900" y="655">Validation</text><text x="1160" y="655">Result</text></g></svg>