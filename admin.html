<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFL Volunteer Admin</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/premium.css">
</head><body><main><section class="section"><div class="wrap"><div class="eyebrow">HFL ADMIN</div><h1>Volunteer Applications</h1><p class="section-intro">Private application review dashboard.</p><div class="card"><label>Admin token<input id="token" type="password" autocomplete="current-password"></label><button class="cta" id="load">Load Applications</button></div><div id="out"></div></div></section></main><script>
const API="https://hfl-volunteer-api.onrender.com";
const out=document.getElementById("out");
document.getElementById("load").onclick=async()=>{const token=document.getElementById("token").value;localStorage.setItem("hfl_admin_token",token);out.innerHTML="<p>Loading…</p>";try{const r=await fetch(API+"/api/admin/volunteers",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok)throw new Error(d.error);out.innerHTML=d.length?d.map(a=>`<article class="card" style="margin-top:16px"><span class="tag">${a.status}</span><h3>${esc(a.full_name)}</h3><p><strong>${esc(a.volunteer_area)}</strong> · ${esc(a.location)} · ${new Date(a.created_at).toLocaleString()}</p><p>${esc(a.email)} · ${esc(a.phone||"")}</p><p>${esc(a.motivation)}</p><select data-id="${a.id}">${["New","Reviewing","Shortlisted","Accepted","Rejected"].map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></article>`).join(""):"<p>No applications yet.";document.querySelectorAll("select[data-id]").forEach(s=>s.onchange=()=>update(s,a=>a.value));}catch(e){out.innerHTML="<p>"+esc(e.message)+"</p>"}};function update(s){fetch(API+"/api/admin/volunteers/"+s.dataset.id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+localStorage.getItem("hfl_admin_token")},body:JSON.stringify({status:s.value})})}function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}const saved=localStorage.getItem("hfl_admin_token");if(saved)document.getElementById("token").value=saved;</script><script src="assets/site.js" defer></script>
</body></html>
