<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Account — HFL Tech</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="description" content="HFL Tech account area."><link rel="stylesheet" href="assets/auth.css?v=20261006"><style>.account{width:min(760px,100%);margin:auto}.account-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:28px}.account-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.account h1{font-size:34px;letter-spacing:-.05em;margin:10px 0}.account p{color:var(--muted);line-height:1.6}.account-meta{display:grid;gap:8px;margin:22px 0}.account-meta div{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:12px}.account-meta span:first-child{color:var(--muted)}.account-meta span:last-child{color:#ddd}.account-actions{display:flex;gap:10px;margin-top:25px}.account-actions a,.account-actions button{padding:10px 14px;border-radius:7px;border:1px solid var(--line2);background:#15171a;color:#ddd;font-size:12px;cursor:pointer}.account-actions a.primary{background:#f2f2f2;color:#090a0b}</style></head><body><main class="auth-shell"><section class="auth-panel" style="grid-column:1/-1"><a class="auth-brand" href="index.html"><b>HFL Tech</b></a><div class="account"><div class="eyebrow">ACCOUNT</div><h1>Your HFL Tech workspace.</h1><p id="state">Checking your secure session…</p><div class="account-card"><div class="account-top"><div><div class="eyebrow">AGENTMESH</div><h2 style="margin:10px 0 0;font-size:20px">AgentMesh workspace</h2></div><span style="font:10px JetBrains Mono;color:#58bf8b">READY</span></div><div class="account-meta"><div><span>Name</span><span id="account-name">—</span></div><div><span>Email</span><span id="account-email">—</span></div></div><p>Open AgentMesh to continue working with your intelligence workspace.</p><div class="account-actions"><a class="primary" href="agentmesh.html">Open AgentMesh →</a><button id="logout">Sign out</button></div></div></div><footer>© 2026 HFL Tech Private Limited</footer></section></main><script>const API='https://agentmesh-hfltech-api.onrender.com';const token=sessionStorage.getItem('hfltech_session');const state=document.getElementById('state');if(!token){location.href='auth.html?mode=login'}else{fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{if(!d.authenticated)throw new Error('Session expired');document.getElementById('account-name').textContent=d.name||'HFL Tech member';document.getElementById('account-email').textContent=d.email||'';state.textContent='You are signed in to HFL Tech.'}).catch(()=>{sessionStorage.removeItem('hfltech_session');location.href='auth.html?mode=login'})}document.getElementById('logout').onclick=async()=>{try{await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}finally{sessionStorage.removeItem('hfltech_session');sessionStorage.removeItem('hfltech_name');sessionStorage.removeItem('hfltech_email');location.href='auth.html?mode=login'}};</script></body></html>
