<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — HFL Tech</title><link rel="stylesheet" href="assets/auth.css"><style>.account{width:min(760px,100%);margin:auto}.account-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:28px}.account-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.account h1{font-size:34px;letter-spacing:-.05em;margin:10px 0}.account p{color:var(--muted);line-height:1.6}.account-actions{display:flex;gap:10px;margin-top:25px}.account-actions a,.account-actions button{padding:10px 14px;border-radius:7px;border:1px solid var(--line2);background:#15171a;color:#ddd;font-size:12px;cursor:pointer}.account-actions a.primary{background:#f2f2f2;color:#090a0b}</style></head><body><main class="auth-shell"><section class="auth-panel" style="grid-column:1/-1"><a class="auth-brand" href="index.html"><span>HFL</span><b>HFL Tech</b></a><div class="account"><div class="eyebrow">ACCOUNT</div><h1>Your HFL Tech workspace.</h1><p id="state">You are signed in. Your account services will appear here as they become available.</p><div class="account-card"><div class="account-top"><div><div class="eyebrow">AGENTMESH</div><h2 style="margin:10px 0 0;font-size:20px">Intelligence workspace</h2></div><span style="font:10px JetBrains Mono;color:#58bf8b">READY</span></div><p>Open AgentMesh to continue working with your intelligence workspace.</p><div class="account-actions"><a class="primary" href="agentmesh.html">Open AgentMesh →</a><button id="logout">Sign out</button></div></div></div><footer>© 2026 HFL Tech</footer></section></main><script>const s=sessionStorage.getItem('hfltech_session');if(!s){location.href='auth.html?mode=login'}document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('hfltech_session');location.href='auth.html?mode=login'};</script></body></html>
