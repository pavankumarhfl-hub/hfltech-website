<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — HFL Tech</title><link rel="stylesheet" href="assets/auth.css"><style>.account{width:min(760px,100%);margin:auto}.account-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:28px}.account-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.account h1{font-size:34px;letter-spacing:-.05em;margin:10px 0}.account p{color:var(--muted);line-height:1.6}.account-actions{display:flex;gap:10px;margin-top:25px}.account-actions a,.account-actions button{padding:10px 14px;border-radius:7px;border:1px solid var(--line2);background:#15171a;color:#ddd;font-size:12px;cursor:pointer}.account-actions a.primary{background:#f2f2f2;color:#090a0b}</style></head><body><main class="auth-shell"><section class="auth-panel" style="grid-column:1/-1"><a class="auth-brand" href="index.html"><span>HFL</span><b>HFL Tech</b></a><div class="account"><div class="eyebrow">ACCOUNT</div><h1 id="greeting">Your HFL Tech workspace.</h1><p id="state">Checking your account session…</p><div class="account-card"><div class="account-top"><div><div class="eyebrow">AGENTMESH</div><h2 style="margin:10px 0 0;font-size:20px">Intelligence workspace</h2></div><span style="font:10px JetBrains Mono;color:#58bf8b">READY</span></div><p>Open AgentMesh to continue working with your intelligence workspace.</p><div class="account-actions"><a class="primary" href="agentmesh.html">Open AgentMesh →</a><button id="logout">Sign out</button></div></div></div><footer>© 2026 HFL Tech</footer></section></main><script>const token=sessionStorage.getItem('hfltech_session');const API='https://agentmesh-hfltech-api.onrender.com';if(!token)location.href='auth.html?mode=login';else fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{if(!d.authenticated){sessionStorage.removeItem('hfltech_session');location.href='auth.html?mode=login';return}document.getElementById('greeting').textContent='Welcome, '+d.name+'.';document.getElementById('state').textContent=d.email+' · HFL Tech account';}).catch(()=>{document.getElementById('state').textContent='Your HFL Tech session is active.'});document.getElementById('logout').onclick=async()=>{try{await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}finally{sessionStorage.removeItem('hfltech_session');sessionStorage.removeItem('hfltech_name');location.href='auth.html?mode=login'}};</script></body></html>
